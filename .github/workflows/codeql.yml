name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
            runner: macos-26
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      TRANSCRIBER_RUN_MODEL_FIXTURE_TESTS: "0"
      TRANSCRIBER_RUN_FLUIDAUDIO_FIXTURE_TESTS: "0"
      TRANSCRIBER_RUN_LOCAL_ASR_FIXTURE_TESTS: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare Xcode project and verify package lock
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          swift --version
          xcodegen generate
          scripts/sync-package-lock.sh --verify

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build app for analysis
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme Transcriber \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath "$RUNNER_TEMP/transcriber-codeql" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            build
          scripts/sync-package-lock.sh --verify

      - name: Compile icon helper without running it
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          xcrun swiftc scripts/make-icon.swift \
            -o "$RUNNER_TEMP/transcriber-icon-helper"

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
